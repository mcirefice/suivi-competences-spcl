<div class="navBar" id="navBar"></div>
<script>
(function() {
  var scriptUrl = "<?= scriptUrl ?>";
  var currentPage = "<?= currentPage ?>";
  google.script.run.withSuccessHandler(function(modules) {
    var zone = document.getElementById("navBar");
    modules.forEach(function(m) {
      var a = document.createElement("a");
      a.className = "navPill" + (m.page === currentPage ? " actif" : "");
      a.href = scriptUrl + "?page=" + m.page;
      a.innerHTML = '<span class="chap">' + m.chapitre + '</span><span class="lab">' + m.label + '</span>';
      zone.appendChild(a);
    });
  }).getModules();
})();
</script>
